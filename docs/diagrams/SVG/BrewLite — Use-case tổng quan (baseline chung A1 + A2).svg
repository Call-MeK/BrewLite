ize="14" lengthAdjust="spacing" textLength="252.3076" x="400.9158" y="580.4592">Xem lịch sử / theo dõi đơn của mình</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="90.1934" x="481.973" y="596.7561">FR-12, FR-13</text></g><!--entity Transition--><g class="entity" data-qualified-name="BrewLite . Next.js . NestJS . PostgreSQL.Transition" data-source-line="20" id="ent0014"><ellipse cx="526.984" cy="752.5937" fill="#F1F1F1" rx="131.984" ry="28.7968" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="244.7607" x="404.6037" y="757.2421">Chuyển trạng thái / hủy đơn hợp lệ</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="40.6465" x="506.6608" y="773.539">FR-13</text></g><!--entity Customer--><g class="entity" data-qualified-name="Customer" data-source-line="7" id="ent0002"><ellipse cx="124.9326" cy="309.7969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M124.9326,317.7969 L124.9326,344.7969 M111.9326,325.7969 L137.9326,325.7969 M124.9326,344.7969 L111.9326,359.7969 M124.9326,344.7969 L137.9326,359.7969" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="82.8652" x="83.5" y="374.292">Khách hàng</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="78.9277" x="83.5" y="390.5889">(Customer)</text></g><!--entity Staff--><g class="entity" data-qualified-name="Staff" data-source-line="8" id="ent0003"><ellipse cx="124.8018" cy="714.7969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M124.8018,722.7969 L124.8018,749.7969 M111.8018,730.7969 L137.8018,730.7969 M124.8018,749.7969 L111.8018,764.7969 M124.8018,749.7969 L137.8018,764.7969" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="237.6035" x="6" y="779.292">Nhân viên / người vận hành demo</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="210.1162" x="6" y="795.5889">(thao tác nội bộ có kiểm soát)</text></g><g class="entity" data-qualified-name="GMN25" data-source-line="36" id="ent0026"><path d="M897,82.2969 L897,152.8281 A0,0 0 0 0 897,152.8281 L1073.5,152.8281 L1077.5,204.3469 L1081.5,152.8281 L1258.4312,152.8281 A0,0 0 0 0 1258.4312,152.8281 L1258.4312,92.2969 L1248.4312,82.2969 L897,82.2969 A0,0 0 0 0 897,82.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1248.4312,82.2969 L1248.4312,92.2969 L1258.4312,92.2969 L1248.4312,82.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="297.6733" x="903" y="99.3638">JWT hợp lệ là tiền điều kiện của POST /orders.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="340.4312" x="903" y="114.4966">Chưa đăng nhập: đi qua luồng Auth, giữ nguyên giỏ,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="328.4658" x="903" y="129.6294">rồi quay lại checkout (FR-06); không include-login.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.7852" x="903" y="144.7622">Chi tiết: use-case-checkout.puml và UC-01.</text></g><g class="entity" data-qualified-name="GMN28" data-source-line="43" id="ent0029"><path d="M1456,98.2969 L1456,153.6953 A0,0 0 0 0 1456,153.6953 L1663.5,153.6953 L1667.5,206.7969 L1671.5,153.6953 L1879.4668,153.6953 A0,0 0 0 0 1879.4668,153.6953 L1879.4668,108.2969 L1869.4668,98.2969 L1456,98.2969 A0,0 0 0 0 1456,98.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1869.4668,98.2969 L1869.4668,108.2969 L1879.4668,108.2969 L1869.4668,98.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="402.4668" x="1462" y="115.3638">Mock Payment là thành phần nội bộ NestJS, không phải actor.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.7026" x="1462" y="130.4966">Khi thành công, cộng điểm đúng một lần là bắt buộc;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="386.147" x="1462" y="145.6294">thất bại: PAYMENT_FAILED, giữ giỏ và cho thử lại cùng đơn.</text></g><g class="entity" data-qualified-name="GMN31" data-source-line="49" id="ent0032"><path d="M305,43.2969 L305,98.6953 L748.9126,98.6953 L748.9126,53.2969 L738.9126,43.2969 L305,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M738.9126,43.2969 L738.9126,53.2969 L748.9126,53.2969 L738.9126,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="341.1611" x="311" y="60.3638">Chỉ dùng thao tác demo nội bộ có kiểm soát và test.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.0454" x="311" y="75.4966">Không có dashboard nhân viên public trong baseline.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="422.9126" x="311" y="90.6294">Manager là stakeholder, không có tương tác runtime đã yêu cầu.</text></g><!--link Customer to Menu--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="association" data-source-line="23" id="lnk15"><path d="M166.58,326.9369 C202.22,309.3969 255.89,284.8369 305,269.7969 C347.44,256.7969 395.8,247.2569 436.44,240.6669" fill="none" id="Customer-Menu" style="stroke:#181818;stroke-width:1;"/></g><!--link Customer to Detail--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type=