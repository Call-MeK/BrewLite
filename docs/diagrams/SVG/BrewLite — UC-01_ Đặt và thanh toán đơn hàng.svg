.0734">FR-05, FR-06, FR-12</text></g><!--entity ValidateOrder--><g class="entity" data-qualified-name="BrewLite . Checkout.ValidateOrder" data-source-line="12" id="ent0006"><ellipse cx="1097.5018" cy="416.1972" fill="#F1F1F1" rx="137.5018" ry="29.9004" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="232.791" x="981.1062" y="415.514">Kiểm tra lựa chọn, giá và tồn kho</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="189.2871" x="1002.8582" y="431.8109">FR-02, FR-03, FR-08, FR-14</text></g><!--entity CreateOrder--><g class="entity" data-qualified-name="BrewLite . Checkout.CreateOrder" data-source-line="13" id="ent0007"><ellipse cx="1097.2725" cy="510.3514" fill="#F1F1F1" rx="130.7725" ry="28.5545" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="240.3379" x="977.1035" y="514.4644">Tạo đơn PENDING và snapshot giá</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="90.1934" x="1052.1758" y="530.7613">FR-07, FR-11</text></g><!--entity ReserveStock--><g class="entity" data-qualified-name="BrewLite . Checkout.ReserveStock" data-source-line="14" id="ent0008"><ellipse cx="1551.6723" cy="311.5433" fill="#F1F1F1" rx="115.6723" ry="33.7464" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="179.1631" x="1462.0908" y="305.6916">Giữ kho trong transaction</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="148.2783" x="1477.5331" y="321.9885">với optimistic locking</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="40.6465" x="1531.3491" y="338.2854">FR-08</text></g><!--entity Pay--><g class="entity" data-qualified-name="BrewLite . Checkout.Pay" data-source-line="15" id="ent0009"><ellipse cx="1097.265" cy="632.0499" fill="#F1F1F1" rx="121.765" ry="26.753" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="212.4678" x="991.0311" y="634.227">Thanh toán Ví / Thẻ mô phỏng</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="90.1934" x="1052.1683" y="650.5239">FR-10, FR-11</text></g><!--entity Promotion--><g class="entity" data-qualified-name="BrewLite . Checkout.Promotion" data-source-line="16" id="ent0010"><ellipse cx="559.227" cy="534.1423" fill="#F1F1F1" rx="127.227" ry="27.8454" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="234.7119" x="441.871" y="538.7907">Kiểm tra và áp dụng mã giảm giá</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="40.6465" x="538.9038" y="555.0876">FR-16</text></g><!--entity Loyalty--><g class="entity" data-qualified-name="BrewLite . Checkout.Loyalty" data-source-line="17" id="ent0011"><ellipse cx="558.7816" cy="663.3532" fill="#F1F1F1" rx="108.2816" ry="24.0563" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="173.4824" x="472.0404" y="664.2166">Cộng điểm đúng một lần</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="40.6465" x="538.4584" y="680.5135">FR-17</text></g><!--entity Retry--><g class="entity" data-qualified-name="BrewLite . Checkout.Retry" data-source-line="18" id="ent0012"><ellipse cx="559.0433" cy="239.1055" fill="#F1F1F1" rx="129.5433" ry="28.3087" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="197.7568" x="460.1648" y="236.1084">Thử thanh toán lại cùng đơn</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="189.2871" x="464.3997" y="252.4053">FR-10, FR-11, FR-13, FR-15</text></g><!--entity Customer--><g class="entity" data-qualified-name="Customer" data-source-line="7" id="ent0002"><ellipse cx="143.4326" cy="218.2969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M143.4326,226.2969 L143.4326,253.2969 M130.4326,234.2969 L156.4326,234.2969 M143.4326,253.2969 L130.4326,268.2969 M143.4326,253.2969 L156.4326,268.2969" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="82.8652" x="102" y="282.792">Khách hàng</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="78.9277" x="102" y="299.0889">(Customer)</text></g><g class="entity" data-qualified-name="GMN25" data-source-line="35" id="ent0026"><path d="M6,354.7969 L6,455.5938 A0,0 0 0 0 6,455.5938 L281.084,455.5938 A0,0 0 0 0 281.084,455.5938 L281.084,409.2969 L443.37,405.2969 L281.084,401.2969 L281.084,364.7969 L271.084,354.7969 L6,354.7969 A0,0 0 0 0 6,354.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M271.084,354.7969 L271.084,364.7969 L281.084,364.7969 L271.084,354.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="202.5093" x="12" y="371.8638">Tiền điều kiện: giỏ không rỗng;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="199.5703" x="12" y="386.9966">JWT hợp lệ trước POST /orders.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="254.084" x="12" y="402.1294">Chưa đăng nhập: đăng ký / đăng nhập,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="221.6094" x="12" y="417.2622">giữ giỏ và quay lại (FR-04, FR-06).</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="237.4341" x="12" y="432.395">Backend lấy user từ JWT, tự tính giá;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="234.127" x="12" y="447.5278">không tin giá / userId do client khai.</text></g><g class="entity" data-qualified-name="GMN28" data-source-line="44" id="ent0029"><path d="M1360,730.7969 L1360,831.5938 A0,0 0 0 0 1360,831.5938 L1742.6006,831.5938 A0,0 0 0 0 1742.6006,831.5938 L1742.6006,740.7969 L1732.6006,730.7969 L1400.94,730.7969 L1166.66,654.7669 L1392.94,730.7969 L1360,730.7969 A0,0 0 0 0 1360,730.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1732.6006,730.7969 L1732.6006,740.7969 L1742.6006,740.7969 L1732.6006,730.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.6006" x="1366" y="747.8638">Mock Payment chạy trong NestJS, không là actor ngoài.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="345.3125" x="1366" y="762.9966">Thành công: PAID, cộng floor(thực trả / 10000) điểm;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="242.4932" x="1366" y="778.1294">xác nhận thành công rồi mới xóa giỏ.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="325.2285" x="1366" y="793.2622">Thất bại: PAYMENT_FAILED, trả kho đúng một lần,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.3789" x="1366" y="808.395">giữ giỏ; không biến thất bại thành CANCELLED.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="260.6221" x="1366" y="823.5278">Kịch bản mock được kiểm soát ở server.</text></g><g class="entity" data-qualified-name="GMN31" data-source-line="53" id="ent0032"><path d="M342,43.2969 L342,159.2266 A0,0 0 0 0 342,159.2266 L555,159.2266 L559,210.7269 L563,159.2266 L776.1816,159.2266 A0,0 0 0 0 776.1816,159.2266 L776.1816,53.2969 L766.1816,43.2969 L342,43.2969 A0,0 0 0 0 342,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M766.1816,43.2969 L766.1816,53.2969 L776.1816,53.2969 L766.1816,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="218.1182" x="348" y="60.3638">Tiền điều kiện: PAYMENT_FAILED.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.6558" x="348" y="75.4966">Cố ý thử lại: payment key mới, cùng orderId;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="356.0908" x="348" y="90.6294">kiểm tra / giữ lại kho rồi PAYMENT_FAILED → PENDING.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.5474" x="348" y="105.7622">Thiếu kho: không đổi trạng thái, không thanh toán.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.8345" x="348" y="120.895">Retry do timeout: dùng lại key + payload + orderId;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.1475" x="348" y="136.0278">trả kết quả cũ, không tạo lần xử lý thanh toán mới.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.1816" x="348" y="151.1606">Cùng key khác payload: từ chối; thành công / điểm chỉ một lần.</text></g><!--link Customer to Checkout--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="association" data-source-line="21" id="lnk13"><path d="M185.28,270.9869 C258.43,297.3469 412.24,352.7769 497.64,383.5469" fill="none" id="Customer-Checkout" style="stroke:#181818;stroke-width:1;"/></g><!--link Customer to Retry--><g class="link" data-e