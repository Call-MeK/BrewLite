<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="966px" preserveAspectRatio="none" style="width:1255px;height:966px;background:#FFFFFF;" version="1.1" viewBox="0 0 1255 966" width="1255px" zoomAndPan="magnify"><title>BrewLite — Trạng thái đơn hàng (FR-13; A1 trang PDF 8)</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="447.2822" x="396.9482" y="22.9951">BrewLite — Trạng thái đơn hàng (FR-13; A1 trang PDF 8)</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="6" id="ent0002"><ellipse cx="389.5" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73.9912" x="352.5" y="155.7969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="63.9912" x="357.5" y="180.6436">PENDING</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="1194.5" y="318.7969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="32.9287" x="1203.0356" y="343.6436">PAID</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="132.7051" x="274" y="318.7969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="122.7051" x="279" y="343.6436">PAYMENT_FAILED</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="93.6719" x="396.5" y="481.7969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="83.6719" x="401.5" y="506.6436">CANCELLED</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="90.2129" x="989.5" y="481.7969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="80.2129" x="994.5" y="506.6436">PREPARING</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="57.4824" x="957" y="614.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="47.4824" x="962" y="639.1436">READY</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="96.1396" x="832.5" y="731.2969"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="86.1396" x="837.5" y="756.1436">COMPLETED</text><g class="end_entity" data-qualified-name=".end." data-source-line="16" id="ent0020"><ellipse cx="687.5" cy="843.2969" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="687.5" cy="843.2969" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="20" id="ent0003"><path d="M6,140.2969 L6,210.8281 A0,0 0 0 0 6,210.8281 L316.6118,210.8281 A0,0 0 0 0 316.6118,210.8281 L316.6118,179.7969 L352.3,175.7969 L316.6118,171.7969 L316.6118,150.2969 L306.6118,140.2969 L6,140.2969 A0,0 0 0 0 6,140.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M306.6118,140.2969 L306.6118,150.2969 L316.6118,150.2969 L306.6118,140.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.4219" x="12" y="157.3638">FR-07, FR-08: tạo đơn + snapshot + giữ kho</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.6118" x="12" y="172.4966">trong transaction; kiểm tra stock và version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252.1733" x="12" y="187.6294">Thiếu kho / xung đột: rollback toàn bộ.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="280.0205" x="12" y="202.7622">Không giữ transaction trong lúc chờ khách.</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="27" id="ent0006"><path d="M442.5,288.2969 L442.5,334.7969 L407.25,338.7969 L442.5,342.7969 L442.5,389.0938 A0,0 0 0 0 442.5,389.0938 L772.9355,389.0938 A0,0 0 0 0 772.9355,389.0938 L772.9355,298.2969 L762.9355,288.2969 L442.5,288.2969 A0,0 0 0 0 442.5,288.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M762.9355,288.2969 L762.9355,298.2969 L772.9355,298.2969 L762.9355,288.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.0679" x="448.5" y="305.3638">FR-10, FR-11, FR-15: lỗi thanh toán giữ giỏ.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="269.1216" x="448.5" y="320.4966">Cố ý thử lại: cùng đơn, payment key mới;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.3599" x="448.5" y="335.6294">phải kiểm tra và giữ kho trước khi về PENDING.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="218.499" x="448.5" y="350.7622">Thiếu kho: vẫn PAYMENT_FAILED.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="309.4355" x="448.5" y="365.895">Retry do mạng: giữ nguyên key, trả kết quả cũ;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="278.4717" x="448.5" y="381.0278">không phải một lần chuyển trạng thái mới.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="36" id="ent0009"><path d="M807.5,311.2969 L807.5,366.6953 A0,0 0 0 0 807.5,366.6953 L1159.9746,366.6953 A0,0 0 0 0 1159.9746,366.6953 L1159.9746,342.7969 L1194.22,338.7969 L1159.9746,334.7969 L1159.9746,321.2969 L1149.9746,311.2969 L807.5,311.2969 A0,0 0 0 0 807.5,311.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1149.9746,311.2969 L1149.9746,321.2969 L1159.9746,321.2969 L1149.9746,311.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="263.3706" x="813.5" y="328.3638">FR-16, FR-17: giá đã áp dụng mã hợp lệ;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.2729" x="813.5" y="343.4966">cộng floor(thực trả / 10000) điểm đúng một lần.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.4746" x="813.5" y="358.6294">Hai key khác nhau không được tạo hai thành công.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="42" id="ent0012"><path d="M525.5,466.2969 L525.5,497.7969 L490.67,501.7969 L525.5,505.7969 L525.5,536.8281 A0,0 0 0 0 525.5,536.8281 L913.7944,536.8281 A0,0 0 0 0 913.7944,536.8281 L913.7944,476.2969 L903.7944,466.2969 L525.5,466.2969 A0,0 0 0 0 525.5,466.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M903.7944,466.2969 L903.7944,476.2969 L913.7944,476.2969 L903.7944,466.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.3223" x="531.5" y="483.3638">Đề xuất chính sách bù dữ liệu cho PAID → CANCELLED:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.2944" x="531.5" y="498.4966">hoàn thanh toán mô phỏng, trả kho và bù điểm một lần;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="267.9346" x="531.5" y="513.6294">giữ lịch sử Payment / LoyaltyTransaction.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="243.731" x="531.5" y="528.7622">Không hoàn tiền qua ngân hàng thật.</text></g><!--link *start* to PENDING--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="6" id="lnk4"><path d="M389.5,63.3569 C389.5,82.8369 389.5,123.1069 389.5,149.4869" fill="none" id="*start*-to-PENDING" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="389.5,155.4869,393.5,146.4869,389.5,150.4869,385.5,146.4869,389.5,155.4869" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="183.3013" x="390.5" y="106.3638">Tạo đơn / giữ kho nguyên tử</text></g><!--link PENDING to PAID--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="7" id="lnk6"><path d="M426.76,178.5869 C564.72,185.7169 1045.31,215.4169 1177.5,288.2969 C1190.33,295.3669 1197.5683,303.0775 1204.9283,313.8175" fill="none" id="PENDING-to-PAID" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1208.32,318.7669,1206.532,309.0817,1205.4936,314.6424,1199.9328,313.604,1208.32,318.7669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="151.6519" x="1087.5" y="254.3638">Thanh toán thành công</text></g><!--link PENDING to PAYMENT_FAILED--><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" data-source-line="8" id="lnk8"><path d="M361.96,195.8469 C353.4,201.2769 343.77,206.9069 334.5,211.2969 C296.78,229.1769 269.85,207.3969 245.5,241.2969 C224.11,271.0869 258.764,297.5869 293.244,315.9469" fill="none" id="PENDING-to-PAYMENT_FAILED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="298.54,318.7669,292.476,311.0062,294.1267,316.4169,288.716,318.0675,298.54,318.7669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="241.2109" x="246.5" y="254.3638">Thanh toán thất bại / trả kho một lần</text></g><!--link PAYMENT_FAILED to PENDING--><g class="link" data-entity-1="ent0007" data-entity-2="ent0003" data-link-type="dependency" data-source-line="9" id="lnk9"><path d="M371.13,318.5769 C386.84,309.0269 406.43,297.5669 424.5,288.2969 C453.89,273.2169 474.46,285.9669 492.5,258.2969 C513.11,226.6769 469.6576,203.9305 432.3776,190.3505" fill="none" id="PAYMENT_FAILED-to-PENDING" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="426.74,188.2969,433.8273,195.1357,431.438,190.0082,436.5655,187.6189,426.74,188.2969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="272.1875" x="498.5" y="254.3638">Thử lại [giữ lại đủ kho] / payment key mới</text></g><!--link PENDING to CANCELLED--><g class="link" data-entity-1="ent0003" data-entity-2="ent0010" data-link-type="dependency" data-source-line="10" id="lnk11"><path d="M362.35,195.8869 C353.72,201.3869 343.96,207.0369 334.5,211.2969 C240.81,253.4869 173.92,203.0769 116.5,288.2969 C91.42,325.5269 90.38,352.7869 116.5,389.2969 C180.9,479.2969 316.3254,497.2324 390.2954,500.3724" fill="none" id="PENDING-to-CANCELLED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="396.29,500.6269,387.4677,496.2488,391.2945,500.4148,387.1285,504.2416,396.29,500.6269" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="138.4106" x="117.5" y="343.3638">Hủy / trả kho một lần</text></g><!--link PAYMENT_FAILED to CANCELLED--><g class="link" data-entity-1="ent0007" data-entity-2="ent0010" data-link-type="dependency" data-source-line="11" id="lnk12"><path d="M352.72,358.8969 C372.54,389.8869 408.2458,445.6932 428.0658,476.6632" fill="none" id="PAYMENT_FAILED-to-CANCELLED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="431.3,481.7169,429.8178,471.9802,428.6048,477.5055,423.0795,476.2925,431.3,481.7169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="152.9214" x="402.5" y="432.3638">Hủy / không trả kho lặp</text></g><!--link PAID to CANCELLED--><g class="link" data-entity-1="ent0005" data-entity-2="ent0010" data-link-type="dependency" data-source-line="12" id="lnk13"><path d="M1208.45,359.0669 C1201.14,369.8969 1190.51,382.5569 1177.5,389.2969 C1110.74,423.8769 915.19,410.6869 840.5,419.2969 C692.45,436.3569 650.23,420.2269 508.5,466.2969 C496.84,470.0869 490.0407,473.0015 479.5207,478.7715" fill="none" id="PAID-to-CANCELLED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="474.26,481.6569,484.0746,480.8359,478.6439,479.2524,480.2274,473.8217,474.26,481.6569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="274.3901" x="841.5" y="432.3638">Hủy trước khi pha chế / bù dữ liệu một lần</text></g><!--link PAID to PREPARING--><g class="link" data-entity-1="ent0005" data-entity-2="ent0014" data-link-type="dependency" data-source-line="13" id="lnk15"><path d="M1204.8,358.9369 C1197.1,368.4669 1187.26,379.9369 1177.5,389.2969 C1140.25,425.0369 1096.9429,457.2883 1067.1029,478.3383" fill="none" id="PAID-to-PREPARING" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1062.2,481.7969,1071.86,479.8775,1066.2857,478.9147,1067.2485,473.3404,1062.2,481.7969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="106.6787" x="1140.5" y="432.3638">Bắt đầu pha chế</text></g><!--link PREPARING to READY--><g class="link" data-entity-1="ent0014" data-entity-2="ent0016" data-link-type="dependency" data-source-line="14" id="lnk17"><path d="M1027.27,522.0569 C1018.01,546.7269 1004.1487,583.6296 994.8687,608.3496" fill="none" id=